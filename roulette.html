<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette - GitHub Arcade</title>
<style>
body{background:#0f111a;color:#fff;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;text-align:center;margin:0;padding:20px}
a{color:#00e5ff;text-decoration:none}
.balance-card{background:#1a1d29;display:inline-block;padding:15px 30px;border-radius:12px;border:1px solid #2a2e3f;font-size:1.4rem;margin:25px}
.balance{color:#4caf50;font-weight:bold}
.wheel{width:220px;height:220px;margin:30px auto;border-radius:50%;border:10px solid #333;display:flex;align-items:center;justify-content:center;font-size:60px;
transition:transform 5.5s cubic-bezier(.08,.9,.18,1);will-change:transform;
background:radial-gradient(circle,#222 20%,transparent 20%),conic-gradient(red 0 18deg,black 18deg 36deg,red 36deg 54deg,black 54deg 72deg,red 72deg 90deg,black 90deg 108deg,red 108deg 126deg,black 126deg 144deg,red 144deg 162deg,black 162deg 180deg,red 180deg 198deg,black 198deg 216deg,red 216deg 234deg,black 234deg 252deg,red 252deg 270deg,black 270deg 288deg,red 288deg 306deg,black 306deg 324deg,red 324deg 342deg,green 342deg 360deg)}
.pointer{font-size:40px;margin-bottom:-20px}
.controls{margin:30px}
input,select{padding:10px;margin:8px;font-size:18px;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
button{padding:12px 24px;font-size:18px;background:#ff3e6c;color:#fff;border:none;border-radius:10px;cursor:pointer}
button:hover{background:#ff5f88}
#result{font-size:26px;margin-top:25px}
.history{margin-top:30px}
.ball{font-size:45px}
</style>
</head>
<body>
<a href="index.html">⬅ Back to Lobby</a>
<h1>🎡 Roulette</h1>
<div class="balance-card">Wallet: <span class="balance" id="balance">$0.00</span></div>
<div class="pointer">▼</div>
<div id="wheel" class="wheel"><div class="ball">⚪</div></div>
<div class="controls">
<input id="betAmount" type="number" min="1" value="10">
<select id="betType">
<option value="red">Red (2x)</option>
<option value="black">Black (2x)</option>
<option value="even">Even (2x)</option>
<option value="odd">Odd (2x)</option>
<option value="number">Exact Number (36x)</option>
</select>
<input id="number" type="number" min="0" max="36" value="17">
<br><br>
<button onclick="spin()">SPIN</button>
</div>
<div id="result"></div>
<div class="history"><h3>Last Spins</h3><div id="history"></div></div>
<script>
if(!localStorage.getItem("arcade_balance")) localStorage.setItem("arcade_balance","1000");
let balance=parseFloat(localStorage.getItem("arcade_balance"));
function updateBalance(){document.getElementById("balance").innerText="$"+balance.toFixed(2)}
updateBalance();
const redNumbers=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
let history=[],currentRotation=0,spinning=false;
function spin(){
 if(spinning)return;
 let bet=parseFloat(document.getElementById("betAmount").value);
 if(bet<=0||bet>balance){alert("Invalid bet.");return;}
 spinning=true;
 const wheel=document.getElementById("wheel");
 let number=Math.floor(Math.random()*37);
 let color=number===0?"green":(redNumbers.includes(number)?"red":"black");
 currentRotation+=360*(10+Math.floor(Math.random()*7))+Math.random()*360;
 wheel.style.transform=`rotate(${currentRotation}deg)`;
 setTimeout(()=>{
 let win=false,payout=0,type=document.getElementById("betType").value;
 if(type==="red"&&color==="red"){win=true;payout=bet*2;}
 if(type==="black"&&color==="black"){win=true;payout=bet*2;}
 if(type==="even"&&number!==0&&number%2===0){win=true;payout=bet*2;}
 if(type==="odd"&&number%2===1){win=true;payout=bet*2;}
 if(type==="number"){
   let pick=parseInt(document.getElementById("number").value);
   if(pick===number){win=true;payout=bet*36;}
 }
 balance-=bet;
 if(win) balance+=payout;
 localStorage.setItem("arcade_balance",balance.toFixed(2));
 updateBalance();
 document.getElementById("result").innerHTML=win?`🎉 WIN! ${number} (${color})<br>+$${(payout-bet).toFixed(2)}`:`💀 Lost! ${number} (${color})`;
 history.unshift(`${number} (${color})`);
 history=history.slice(0,10);
 document.getElementById("history").innerHTML=history.join(" • ");
 spinning=false;
 },5500);
}
</script>
</body>
</html>
